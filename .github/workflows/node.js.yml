# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]
  # Daily run against the `edge` image to catch breaking changes in upcoming
  # FalkorDB releases before they reach a stable release.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      falkordb_image_tag:
        description: "FalkorDB Docker image tag to test against (defaults to latest)"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # FalkorDB image tag under test, read by the docker/*-compose.yml files: the
  # released `latest` for pull requests, pushes, tags and releases, `edge` for
  # the scheduled daily run, or an explicit tag on manual dispatch.
  FALKORDB_VERSION: ${{ github.event.inputs.falkordb_image_tag || (github.event_name == 'schedule' && 'edge' || 'latest') }}

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Run docker-compose for FalkorDB standalone instance
      uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
      with:
        compose-file: ./docker/standalone-compose.yml
    - name: Test if FalkorDB standalone instance is running
      run: |
        docker ps -a
        docker logs falkordb-standalone
        docker exec falkordb-standalone redis-cli ping || { echo "FalkorDB standalone instance is not running"; exit 1; }

    - name: Run docker-compose for FalkorDB replication instance
      uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
      with:
        compose-file: ./docker/sentinel-compose.yml

    - name: Test if FalkorDB replication instance is running
      run: |
        docker ps -a
        docker logs sentinel-1
        docker exec sentinel-1 redis-cli -p 26379 ping || { echo "FalkorDB replication instance is not running"; exit 1; }
        docker logs sentinel-2
        docker exec sentinel-2 redis-cli -p 26380 ping || { echo "FalkorDB replication instance is not running"; exit 1; }
        docker logs sentinel-3
        docker exec sentinel-3 redis-cli -p 26381 ping || { echo "FalkorDB replication instance is not running"; exit 1; }

    - name: Run docker-compose for FalkorDB cluster instance
      uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
      with:
        compose-file: ./docker/cluster-compose.yml
    
    - name: Test if FalkorDB cluster instance is running
      run: |
        docker ps -a
        for i in {0..5};do
          port=$((17000 + $i))
          docker logs node$i
          docker exec node$i redis-cli -p $port ping || { echo "FalkorDB cluster instance is not running"; exit 1; }
        done
    
    - name: Add entries to the host file to correctly resolve service names
      run: |
        sudo echo "127.0.0.1 falkordb-standalone" | sudo tee -a /etc/hosts
        sudo echo "127.0.0.1 sentinel-1"       | sudo tee -a /etc/hosts
        sudo echo "127.0.0.1 sentinel-2"       | sudo tee -a /etc/hosts
        sudo echo "127.0.0.1 sentinel-3"       | sudo tee -a /etc/hosts
        sudo echo "127.0.0.1 falkordb-server-1"   | sudo tee -a /etc/hosts
        sudo echo "127.0.0.1 falkordb-server-2"   | sudo tee -a /etc/hosts
        for i in node{0..5};do
          echo "127.0.0.1 $i" | sudo tee -a /etc/hosts
        done
    
    - name: install docker-compose client
      run: sudo apt update && sudo apt install docker-compose -y

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - run: npm ci
    - run: npm run lint
    - run: npm run build --if-present
    - name: Show running Docker containers
      run: docker ps -a

    - name: Wait for cluster to be fully ready
      run: |
        echo "Waiting for cluster formation to complete..."
        for i in {1..30}; do
          if docker exec node0 redis-cli -p 17000 cluster info | grep -q "cluster_state:ok"; then
            echo "Cluster state is OK after $i attempts"
            break
          fi
          echo "Attempt $i: Cluster not ready yet, waiting 2 seconds..."
          sleep 2
          if [ $i -eq 30 ]; then
            echo "Cluster failed to become ready after 60 seconds"
            docker logs cluster-creator
            exit 1
          fi
        done
        
        # Verify cluster is actually working
        docker exec node0 redis-cli -p 17000 --cluster check node0:17000 || { echo "Cluster check failed"; exit 1; }
        echo "Cluster is fully ready and operational!"

    - name: Disable RDB snapshots on test servers
      # Periodic BGSAVE forks race with GRAPH.COPY's fork and make copy tests
      # fail with "GRAPH.COPY failed, could not fork". Snapshots are useless
      # for these throwaway CI servers, so turn them off.
      run: |
        docker exec falkordb-standalone redis-cli config set save ""
        docker exec falkordb-server-1 redis-cli -p 6380 config set save ""
        docker exec falkordb-server-2 redis-cli -p 6381 config set save ""
        for i in {0..5}; do
          port=$((17000 + i))
          docker exec node$i redis-cli -p $port config set save ""
        done

    - name: Run tests
      run: npx jest --coverage
      env:
        FALKORDB_HOST: 127.0.0.1
        FALKORDB_PORT: 6379
    
    - name: Notify Google Chat
      id: test-action
      if: failure() # only send notification in case of failure
      uses: SimonScholz/google-chat-action@3b3519e5102dba8aa5046fd711c4b553586409bb # v1.1.0
      with:
          webhookUrl: '${{ secrets.DRIVERS_GOOGLE_CHAT_WEBHOOK_URL }}'
          jobStatus: ${{ job.status }}
          threadKey: ${{ github.event.number }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # A cron job has nobody watching it: GitHub only emails whoever last touched
  # the cron line, so a failing daily run would otherwise go unnoticed. Post it
  # to Google Chat instead.
  report-scheduled-failure:
    name: Report scheduled failure
    needs: [build]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      DRIVERS_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DRIVERS_GOOGLE_CHAT_WEBHOOK_URL }}
      REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.workflow }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Notify Google Chat
        if: ${{ env.DRIVERS_GOOGLE_CHAT_WEBHOOK_URL != '' }}
        run: |
          text=$(printf '%s\n' \
            "*$REPO* — the daily \`$WORKFLOW\` run against \`falkordb/falkordb:edge\` failed." \
            "<$RUN_URL|View the run>" \
            "" \
            "\`edge\` is an unreleased FalkorDB build, so released users are unaffected: this is an early warning that the next FalkorDB release breaks this client.")
          jq -n --arg text "$text" '{text: $text}' > payload.json
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            -d @payload.json "$DRIVERS_GOOGLE_CHAT_WEBHOOK_URL"

      # Fallback while the webhook secret is not configured, so the signal is
      # never lost. Opens one issue and comments on it on subsequent failures.
      - name: Open or update a tracking issue
        if: ${{ env.DRIVERS_GOOGLE_CHAT_WEBHOOK_URL == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI is failing against falkordb/falkordb:edge"
        run: |
          body=$(printf '%s\n' \
            "The daily \`$WORKFLOW\` run against \`falkordb/falkordb:edge\` failed." \
            "" \
            "$RUN_URL" \
            "" \
            "Set the \`DRIVERS_GOOGLE_CHAT_WEBHOOK_URL\` secret to receive this in Google Chat instead.")
          number=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
